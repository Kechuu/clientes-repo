<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes - Estudio Contable</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK v12 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc 
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        // ==========================================
        // CONFIGURACIÓN DE FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBMr9S5Hx8KhZto1K-TM1tqdpoShb8Cd5I",
            authDomain: "clientes-25157.firebaseapp.com",
            projectId: "clientes-25157",
            storageBucket: "clientes-25157.firebasestorage.app",
            messagingSenderId: "964761913555",
            appId: "1:964761913555:web:f4591e75b00bd68f956c26"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // CREDENCIALES DE ACCESO LOCAL
        // ==========================================
        const CORREOS_AUTORIZADOS = [
            "jesusangelcabrera255@gmail.com",
            "laurabdeiana@gmail.com"
        ];
        
        const CLAVE_MESTRA = "Estudio2026*";

        let clientes = [];
        let idEditando = null;
        let unsubscribeRealtime = null;

        // Referencias DOM
        let loginSection, appSection, userEmailSpan, clientForm, formContainer, btnToggleForm;
        let nombreInput, cuitInput, bancoInput, arcaInput, rentasInput, artInput, buscadorInput;
        let contenedorClientes, btnCancelar, btnGuardar, modalImprimir;

        window.addEventListener('DOMContentLoaded', () => {
            // Inicializar Referencias DOM
            loginSection = document.getElementById('loginSection');
            appSection = document.getElementById('appSection');
            userEmailSpan = document.getElementById('userEmail');
            clientForm = document.getElementById('clientForm');
            formContainer = document.getElementById('formContainer');
            btnToggleForm = document.getElementById('btnToggleForm');
            nombreInput = document.getElementById('nombre');
            cuitInput = document.getElementById('cuit');
            bancoInput = document.getElementById('banco');
            arcaInput = document.getElementById('arca');
            rentasInput = document.getElementById('rentas');
            artInput = document.getElementById('art');
            buscadorInput = document.getElementById('buscador');
            contenedorClientes = document.getElementById('contenedorClientes');
            btnCancelar = document.getElementById('btnCancelar');
            btnGuardar = document.getElementById('btnGuardar');
            modalImprimir = document.getElementById('modalImprimir');

            // Formateador CUIT
            cuitInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 11) value = value.slice(0, 11);
                if (value.length > 10) {
                    value = value.replace(/^(\d{2})(\d{8})(\d{1})$/, '$1-$2-$3');
                } else if (value.length > 2) {
                    value = value.replace(/^(\d{2})(\d{0,8})/, '$1-$2');
                }
                e.target.value = value;
            });

            // Buscador en vivo
            buscadorInput.addEventListener('input', function() {
                mostrarClientes(buscadorInput.value);
            });

            // Submit del Formulario
            clientForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const cuitLimpio = cuitInput.value.trim();

                if (!validarCUIT(cuitLimpio)) {
                    mostrarToast("El CUIT ingresado no es válido.", "error");
                    cuitInput.focus();
                    return;
                }

                const condicionSeleccionada = document.querySelector('input[name="condicion"]:checked');
                const estadoSeleccionado = document.querySelector('input[name="estado"]:checked');
                
                const datosCliente = {
                    nombre: nombreInput.value.trim(),
                    cuit: cuitLimpio,
                    condicion: condicionSeleccionada ? condicionSeleccionada.value : '',
                    estado: estadoSeleccionado ? estadoSeleccionado.value : 'Activo',
                    banco: bancoInput.value.trim(),
                    arca: arcaInput.value.trim(),
                    rentas: rentasInput.value.trim(),
                    art: artInput.value.trim(),
                    ultimaActualizacion: obtenerFechaHoraActual()
                };

                try {
                    if (idEditando === null) {
                        await addDoc(collection(db, "clientes"), datosCliente);
                        mostrarToast("Cliente registrado exitosamente.");
                    } else {
                        const docRef = doc(db, "clientes", idEditando);
                        await updateDoc(docRef, datosCliente);
                        mostrarToast("Cliente actualizado exitosamente.");
                    }
                    window.limpiarFormulario();
                } catch (error) {
                    console.error("Error al guardar: ", error);
                    mostrarToast("Hubo un error al guardar en la base de datos.", "error");
                }
            });

            // Comprobar sesión activa
            const usuarioGuardado = sessionStorage.getItem('usuarioEstudio');
            if (usuarioGuardado && CORREOS_AUTORIZADOS.includes(usuarioGuardado)) {
                loginSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                if (userEmailSpan) userEmailSpan.textContent = usuarioGuardado;
                suscribirClientes();
            }
        });

        // ==========================================
        // MANEJO DE SESIÓN Y AUTENTICACIÓN LOCAL
        // ==========================================
        window.loginConClave = function(e) {
            if (e) e.preventDefault();

            const emailIngresado = document.getElementById('inputEmail').value.toLowerCase().trim();
            const claveIngresada = document.getElementById('inputPassword').value;

            if (!emailIngresado || !claveIngresada) {
                mostrarToast("Por favor, completa todos los campos.", "error");
                return;
            }

            const autorizadosNormalizados = CORREOS_AUTORIZADOS.map(email => email.toLowerCase().trim());

            if (!autorizadosNormalizados.includes(emailIngresado)) {
                mostrarToast(`El correo ${emailIngresado} no está autorizado.`, "error");
                return;
            }

            if (claveIngresada !== CLAVE_MESTRA) {
                mostrarToast("Contraseña incorrecta.", "error");
                return;
            }

            loginSection.classList.add('hidden');
            appSection.classList.remove('hidden');
            if (userEmailSpan) userEmailSpan.textContent = emailIngresado;

            sessionStorage.setItem('usuarioEstudio', emailIngresado);
            suscribirClientes();
            mostrarToast("Sesión iniciada correctamente.");
        };

        window.cerrarSesion = function() {
            sessionStorage.removeItem('usuarioEstudio');
            loginSection.classList.remove('hidden');
            appSection.classList.add('hidden');
            document.getElementById('inputPassword').value = '';
            
            if (unsubscribeRealtime) {
                unsubscribeRealtime();
                unsubscribeRealtime = null;
            }
        };

        // ==========================================
        // NOTIFICACIÓN TOAST Y UTILIDADES
        // ==========================================
        function mostrarToast(mensaje, tipo = 'exito') {
            const toast = document.createElement('div');
            const bgClass = tipo === 'exito' ? 'bg-emerald-800' : 'bg-rose-800';
            toast.className = `fixed bottom-5 right-5 ${bgClass} text-white px-4 py-3 rounded-xl shadow-lg z-50 text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 max-w-sm`;
            toast.textContent = mensaje;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function suscribirClientes() {
            unsubscribeRealtime = onSnapshot(collection(db, "clientes"), (snapshot) => {
                clientes = snapshot.docs.map(docSnap => ({
                    id: docSnap.id,
                    ...docSnap.data()
                }));
                mostrarClientes(buscadorInput ? buscadorInput.value : '');
            }, (error) => {
                console.error("Error en tiempo real: ", error);
                if (contenedorClientes) {
                    contenedorClientes.innerHTML = `<div class="py-6 text-center text-rose-600 font-medium">Error de permisos o conexión con Firestore.</div>`;
                }
            });
        }

        window.toggleFormulario = function() {
            if (formContainer.classList.contains('hidden')) {
                formContainer.classList.remove('hidden');
                btnToggleForm.textContent = "✕ Cerrar Formulario";
                btnToggleForm.className = "bg-slate-700 text-white px-3 py-2 rounded-lg text-xs font-medium hover:bg-slate-800 transition-colors shadow-sm";
                nombreInput.focus();
            } else {
                limpiarFormulario();
            }
        };

        window.toggleModalImprimir = function() {
            modalImprimir.classList.toggle('hidden');
        };

        function obtenerFechaHoraActual() {
            const ahora = new Date();
            const dia = String(ahora.getDate()).padStart(2, '0');
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const anio = ahora.getFullYear();
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            return `${dia}/${mes}/${anio} ${horas}:${minutos}`;
        }

        function validarCUIT(cuit) {
            let cleanerCuit = cuit.replace(/[^0-9]/g, '');
            if (cleanerCuit.length !== 11) return false;

            let tipo = cleanerCuit.substring(0, 2);
            if (!['20', '23', '24', '27', '30', '33', '34'].includes(tipo)) return false;

            let acumulado = 0;
            let digitos = cleanerCuit.split('');
            let digitoVerificador = parseInt(digitos.pop());
            let bazos = [5, 4, 3, 2, 7, 6, 5, 4, 3, 2];

            for (let i = 0; i < 10; i++) {
                acumulado += parseInt(digitos[i]) * bazos[i];
            }

            let resultado = 11 - (acumulado % 11);
            if (resultado === 11) resultado = 0;
            if (resultado === 10) resultado = 9;

            return resultado === digitoVerificador;
        }

        window.mostrarClientes = function(filtro = '') {
            clientes.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }));
            contenedorClientes.innerHTML = '';
            
            const textoFiltro = filtro.toLowerCase();
            const clientesFiltrados = clientes.filter(c => 
                (c.nombre && c.nombre.toLowerCase().includes(textoFiltro)) || 
                (c.cuit && c.cuit.toLowerCase().includes(textoFiltro)) ||
                (c.banco && c.banco.toLowerCase().includes(textoFiltro)) ||
                (c.arca && c.arca.toLowerCase().includes(textoFiltro)) ||
                (c.rentas && c.rentas.toLowerCase().includes(textoFiltro)) ||
                (c.art && c.art.toLowerCase().includes(textoFiltro)) ||
                (c.condicion && c.condicion.toLowerCase().includes(textoFiltro)) ||
                (c.estado && c.estado.toLowerCase().includes(textoFiltro))
            );

            if (clientesFiltrados.length === 0) {
                contenedorClientes.innerHTML = `<div class="py-6 text-center text-amber-900/70 font-medium">No se encontraron resultados</div>`;
                return;
            }

            clientesFiltrados.forEach((cliente, index) => {
                const card = document.createElement('div');
                card.className = 'border border-amber-200/80 rounded-xl p-4 bg-white/95 shadow-sm hover:shadow-md transition-shadow';
                
                const condicionTexto = cliente.condicion ? ` (${cliente.condicion})` : '';
                const esActivo = cliente.estado === 'Activo';
                const estadoBadge = esActivo 
                    ? `<span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Activo</span>`
                    : `<span class="bg-rose-100 text-rose-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">Inactivo</span>`;

                const ultimaAct = cliente.ultimaActualizacion ? `• Últ. Act: ${cliente.ultimaActualizacion}` : '';

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div class="flex items-center space-x-3">
                            <button onclick="window.toggleDetalles('${cliente.id}')" id="btn-toggle-${cliente.id}" class="w-8 h-8 flex items-center justify-center bg-amber-100 text-amber-900 font-bold rounded-full hover:bg-amber-200 transition-colors focus:outline-none shadow-xs">+</button>
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="text-xs font-extrabold text-amber-900 bg-amber-100 px-2 py-0.5 rounded-md">#${index + 1}</span>
                                    <h3 class="font-bold text-slate-800 text-base">${cliente.nombre}<span class="text-xs font-medium text-amber-800">${condicionTexto}</span></h3>
                                    ${estadoBadge}
                                </div>
                                <div class="flex items-center gap-2 flex-wrap mt-0.5">
                                    <p class="text-xs text-slate-500 font-mono">CUIT: ${cliente.cuit}</p>
                                    <p class="text-[11px] text-slate-400 font-medium">${ultimaAct}</p>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 self-end sm:self-center">
                            <button onclick="window.copiarDato('${cliente.cuit}', this)" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg hover:bg-emerald-700 text-xs font-medium transition-colors shadow-xs">Copiar CUIT</button>
                            <button onclick="window.editarCliente('${cliente.id}')" class="text-amber-800 hover:text-amber-950 font-semibold text-xs px-2 py-1">Modificar</button>
                            <button onclick="window.eliminarCliente('${cliente.id}')" class="text-rose-600 hover:text-rose-800 font-semibold text-xs px-2 py-1">Eliminar</button>
                        </div>
                    </div>
                    <div id="detalles-${cliente.id}" class="hidden mt-4 pt-4 border-t border-amber-100 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="bg-amber-50/70 p-3 rounded-lg border border-amber-100/80 flex flex-col justify-between">
                            <div>
                                <span class="block text-xs font-bold text-amber-900 uppercase tracking-wide">Banco</span>
                                <span class="text-sm font-medium text-slate-700 break-all">${cliente.banco || '<span class="text-slate-400 italic">No especificado</span>'}</span>
                            </div>
                            ${cliente.banco ? `<button onclick="window.copiarDato('${cliente.banco}', this)" class="mt-3 bg-amber-700 text-white py-1.5 px-2.5 rounded-md hover:bg-amber-800 text-xs font-medium self-start transition-colors shadow-xs">Copiar Banco</button>` : ''}
                        </div>
                        <div class="bg-amber-50/70 p-3 rounded-lg border border-amber-100/80 flex flex-col justify-between">
                            <div>
                                <span class="block text-xs font-bold text-amber-900 uppercase tracking-wide">Clave ARCA</span>
                                <span class="text-sm font-mono text-slate-700 break-all">${cliente.arca || '<span class="text-slate-400 italic">No especificada</span>'}</span>
                            </div>
                            ${cliente.arca ? `<button onclick="window.copiarDato('${cliente.arca}', this)" class="mt-3 bg-amber-700 text-white py-1.5 px-2.5 rounded-md hover:bg-amber-800 text-xs font-medium self-start transition-colors shadow-xs">Copiar ARCA</button>` : ''}
                        </div>
                        <div class="bg-amber-50/70 p-3 rounded-lg border border-amber-100/80 flex flex-col justify-between">
                            <div>
                                <span class="block text-xs font-bold text-amber-900 uppercase tracking-wide">Clave Rentas</span>
                                <span class="text-sm font-mono text-slate-700 break-all">${cliente.rentas || '<span class="text-slate-400 italic">No especificada</span>'}</span>
                            </div>
                            ${cliente.rentas ? `<button onclick="window.copiarDato('${cliente.rentas}', this)" class="mt-3 bg-amber-700 text-white py-1.5 px-2.5 rounded-md hover:bg-amber-800 text-xs font-medium self-start transition-colors shadow-xs">Copiar Rentas</button>` : ''}
                        </div>
                        <div class="bg-amber-50/70 p-3 rounded-lg border border-amber-100/80 flex flex-col justify-between">
                            <div>
                                <span class="block text-xs font-bold text-amber-900 uppercase tracking-wide">Clave ART</span>
                                <span class="text-sm font-mono text-slate-700 break-all">${cliente.art || '<span class="text-slate-400 italic">No especificada</span>'}</span>
                            </div>
                            ${cliente.art ? `<button onclick="window.copiarDato('${cliente.art}', this)" class="mt-3 bg-amber-700 text-white py-1.5 px-2.5 rounded-md hover:bg-amber-800 text-xs font-medium self-start transition-colors shadow-xs">Copiar ART</button>` : ''}
                        </div>
                    </div>
                `;
                contenedorClientes.appendChild(card);
            });
        };

        window.toggleDetalles = function(id) {
            const panel = document.getElementById(`detalles-${id}`);
            const boton = document.getElementById(`btn-toggle-${id}`);
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                boton.textContent = '-';
                boton.className = 'w-8 h-8 flex items-center justify-center bg-amber-800 text-white font-bold rounded-full hover:bg-amber-900 transition-colors focus:outline-none shadow-xs';
            } else {
                panel.classList.add('hidden');
                boton.textContent = '+';
                boton.className = 'w-8 h-8 flex items-center justify-center bg-amber-100 text-amber-900 font-bold rounded-full hover:bg-amber-200 transition-colors focus:outline-none shadow-xs';
            }
        };

        window.copiarDato = function(texto, boton) {
            let textoACopiar = texto;
            if (validarCUIT(texto)) {
                textoACopiar = texto.replace(/-/g, '');
            }

            navigator.clipboard.writeText(textoACopiar).then(() => {
                const original = boton.textContent;
                boton.textContent = "¡Copiado!";
                boton.className = 'bg-emerald-700 text-white py-1.5 px-2.5 rounded-md text-xs font-medium shadow-xs';
                setTimeout(() => {
                    boton.textContent = original;
                    boton.className = original.includes('CUIT') 
                        ? 'bg-emerald-600 text-white px-3 py-1.5 rounded-lg hover:bg-emerald-700 text-xs font-medium transition-colors shadow-xs' 
                        : 'mt-3 bg-amber-700 text-white py-1.5 px-2.5 rounded-md hover:bg-amber-800 text-xs font-medium self-start transition-colors shadow-xs';
                }, 1500);
            });
        };

        window.editarCliente = function(id) {
            const cliente = clientes.find(c => c.id === id);
            if (!cliente) return;

            nombreInput.value = cliente.nombre;
            cuitInput.value = cliente.cuit;
            
            if (cliente.condicion) {
                const radio = document.querySelector(`input[name="condicion"][value="${cliente.condicion}"]`);
                if (radio) radio.checked = true;
            } else {
                document.querySelectorAll('input[name="condicion"]').forEach(r => r.checked = false);
            }

            if (cliente.estado) {
                const radioEstado = document.querySelector(`input[name="estado"][value="${cliente.estado}"]`);
                if (radioEstado) radioEstado.checked = true;
            } else {
                const radioActivo = document.querySelector('input[name="estado"][value="Activo"]');
                if (radioActivo) radioActivo.checked = true;
            }

            bancoInput.value = cliente.banco || '';
            arcaInput.value = cliente.arca || '';
            rentasInput.value = cliente.rentas || '';
            artInput.value = cliente.art || '';
            idEditando = id;
            btnGuardar.textContent = "Actualizar Cliente";
            btnCancelar.classList.remove('hidden');
            
            formContainer.classList.remove('hidden');
            btnToggleForm.textContent = "✕ Cerrar Formulario";
            btnToggleForm.className = "bg-slate-700 text-white px-3 py-2 rounded-lg text-xs font-medium hover:bg-slate-800 transition-colors shadow-sm";
            
            nombreInput.focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.eliminarCliente = async function(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este cliente?")) {
                try {
                    await deleteDoc(doc(db, "clientes", id));
                    mostrarToast("Cliente eliminado correctamente.");
                } catch (error) {
                    console.error("Error al eliminar: ", error);
                    mostrarToast("No se pudo eliminar el registro.", "error");
                }
            }
        };

        window.limpiarFormulario = function() {
            nombreInput.value = '';
            cuitInput.value = '';
            document.querySelectorAll('input[name="condicion"]').forEach(r => r.checked = false);
            const radioActivo = document.querySelector('input[name="estado"][value="Activo"]');
            if (radioActivo) radioActivo.checked = true;
            bancoInput.value = '';
            arcaInput.value = '';
            rentasInput.value = '';
            artInput.value = '';
            idEditando = null;
            btnGuardar.textContent = "Guardar Cliente";
            btnCancelar.classList.add('hidden');
            formContainer.classList.add('hidden');
            btnToggleForm.textContent = "+ Nuevo Cliente";
            btnToggleForm.className = "bg-amber-700 text-white px-3 py-2 rounded-lg text-xs font-medium hover:bg-amber-800 transition-colors shadow-sm";
        };

        window.ejecutarImpresion = function() {
            const condicionSeleccionada = document.querySelector('input[name="filtroImpresionCondicion"]:checked').value;
            const estadoSeleccionado = document.querySelector('input[name="filtroImpresionEstado"]:checked').value;

            const filtrados = clientes.filter(c => {
                let coincideCondicion = (condicionSeleccionada === 'Todos' || c.condicion === condicionSeleccionada);
                let coincideEstado = (estadoSeleccionado === 'Todos' || c.estado === estadoSeleccionado);
                return coincideCondicion && coincideEstado;
            });

            if (filtrados.length === 0) {
                mostrarToast("No se encontraron clientes con los filtros seleccionados.", "error");
                return;
            }

            filtrados.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es', { sensitivity: 'base' }));

            window.toggleModalImprimir();

            let tituloFiltro = `Condición: ${condicionSeleccionada} | Estado: ${estadoSeleccionado}`;

            let ventanaImpresion = window.open('', '_blank');
            ventanaImpresion.document.write(`
                <html>
                <head>
                    <title>Reporte de Clientes - Estudio Contable</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; color: #333; }
                        h2 { text-align: center; color: #78350f; margin-bottom: 5px; }
                        h4 { text-align: center; color: #555; margin-top: 0; margin-bottom: 20px; }
                        .estudio { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #92400e; }
                        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
                        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
                        th { background-color: #fef3c7; color: #78350f; }
                        tr:nth-child(even) { background-color: #fafaf9; }
                        .text-center { text-align: center; }
                    </style>
                </head>
                <body>
                    <div class="estudio">Estudio Contable Laura B. Deiana</div>
                    <h2>Listado de Clientes</h2>
                    <h4>${tituloFiltro}</h4>
                    <table>
                        <thead>
                            <tr>
                                <th class="text-center" style="width: 40px;">Nº</th>
                                <th>Apellido y Nombre</th>
                                <th>CUIT</th>
                                <th>Condición</th>
                                <th>Estado</th>
                                <th>Banco</th>
                                <th>ARCA</th>
                                <th>Rentas</th>
                                <th>ART</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filtrados.map((c, idx) => `
                                <tr>
                                    <td class="text-center"><b>${idx + 1}</b></td>
                                    <td><b>${c.nombre}</b></td>
                                    <td>${c.cuit}</td>
                                    <td>${c.condicion || '-'}</td>
                                    <td>${c.estado || 'Activo'}</td>
                                    <td>${c.banco || '-'}</td>
                                    <td>${c.arca || '-'}</td>
                                    <td>${c.rentas || '-'}</td>
                                    <td>${c.art || '-'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    <script>
                        window.onload = function() { window.print(); }
                    <\/script>
                </body>
                </html>
            `);
            ventanaImpresion.document.close();
        };
    </script>
    <style>
        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- PANTALLA DE LOGIN CON CONTRASEÑA -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white/95 backdrop-blur-md p-8 rounded-2xl shadow-2xl max-w-md w-full text-center border border-amber-200">
            <span class="text-xs font-bold tracking-wider uppercase text-amber-900 bg-amber-200/80 px-2.5 py-1 rounded-md">Estudio Contable</span>
            <h1 class="text-2xl font-extrabold text-slate-900 mt-3">Laura B. Deiana</h1>
            <p class="text-sm text-slate-600 mt-1 mb-6">Ingresa tus credenciales para acceder al sistema.</p>
            
            <form onsubmit="window.loginConClave(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-amber-900 uppercase mb-1">Correo Autorizado</label>
                    <input type="email" id="inputEmail" placeholder="correo@ejemplo.com" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-amber-900 uppercase mb-1">Contraseña de Acceso</label>
                    <input type="password" id="inputPassword" placeholder="••••••••" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <button type="submit" class="w-full bg-amber-800 text-white font-semibold py-3 px-4 rounded-xl hover:bg-amber-900 transition-colors shadow-sm mt-2">
                    Ingresar al Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL (PANEL SPA) -->
    <div id="appSection" class="hidden min-h-screen p-4 sm:p-6 flex items-center justify-center">
        <div class="max-w-4xl w-full mx-auto bg-white/95 backdrop-blur-md shadow-2xl rounded-2xl p-6 border border-amber-200/60 relative">
            
            <!-- HEADER PRINCIPAL -->
            <header class="mb-6 border-b border-amber-200/60 pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <span class="text-xs font-bold tracking-wider uppercase text-amber-900 bg-amber-200/80 px-2.5 py-1 rounded-md">Estudio Contable</span>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">Laura B. Deiana</h1>
                    <p class="text-xs text-slate-600 font-medium mt-0.5">Usuario: <span id="userEmail" class="font-bold text-amber-900"></span></p>
                </div>
                
                <div class="flex items-center gap-2 flex-wrap">
                    <button onclick="window.toggleModalImprimir()" class="bg-amber-800 text-white px-3 py-2 rounded-lg text-xs font-medium hover:bg-amber-900 transition-colors shadow-sm flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        Imprimir Listado
                    </button>
                    <button id="btnToggleForm" onclick="window.toggleFormulario()" class="bg-amber-700 text-white px-3 py-2 rounded-lg text-xs font-medium hover:bg-amber-800 transition-colors shadow-sm">
                        + Nuevo Cliente
                    </button>
                    <button onclick="window.cerrarSesion()" class="bg-slate-200 text-slate-700 hover:bg-slate-300 px-3 py-2 rounded-lg text-xs font-medium transition-colors shadow-sm">
                        Salir
                    </button>
                </div>
            </header>

            <!-- FORMULARIO DE CLIENTE -->
            <div id="formContainer" class="hidden mb-6 bg-amber-50/50 p-4 sm:p-5 rounded-xl border border-amber-200/80">
                <form id="clientForm" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-amber-900 uppercase mb-1">Nombre y Apellido / Razón Social *</label>
                            <input type="text" id="nombre" required placeholder="Ej: Perez Juan Manuel" class="w-full px-3 py-2 border border-amber-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-amber-900 uppercase mb-1">CUIT *</label>
                            <input type="text" id="cuit" required placeholder="XX-XXXXXXXX-X" class="w-full px-3 py-2 border border-amber-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white font-mono">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                        <div>
                            <span class="block text-xs font-bold text-amber-900 uppercase mb-2">Condición IVA</span>
                            <div class="flex flex-wrap gap-3">
                                <label class="inline-flex items-center text-xs text-slate-700 font-medium">
                                    <input type="radio" name="condicion" value="RI" class="text-amber-700 focus:ring-amber-500">
                                    <span class="ml-1.5">Responsable Inscripto</span>
                                </label>
                                <label class="inline-flex items-center text-xs text-slate-700 font-medium">
                                    <input type="radio" name="condicion" value="Monotributo" class="text-amber-700 focus:ring-amber-500">
                                    <span class="ml-1.5">Monotributo</span>
                                </label>
                                <label class="inline-flex items-center text-xs text-slate-700 font-medium">
                                    <input type="radio" name="condicion" value="Exento" class="text-amber-700 focus:ring-amber-500">
                                    <span class="ml-1.5">Exento</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <span class="block text-xs font-bold text-amber-900 uppercase mb-2">Estado</span>
                            <div class="flex gap-4">
                                <label class="inline-flex items-center text-xs text-slate-700 font-medium">
                                    <input type="radio" name="estado" value="Activo" checked class="text-amber-700 focus:ring-amber-500">
                                    <span class="ml-1.5">Activo</span>
                                </label>
                                <label class="inline-flex items-center text-xs text-slate-700 font-medium">
                                    <input type="radio" name="estado" value="Inactivo" class="text-amber-700 focus:ring-amber-500">
                                    <span class="ml-1.5">Inactivo</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 pt-2">
                        <div>
                            <label class="block text-xs font-bold text-amber-900 uppercase mb-1">Banco / Clave</label>
                            <input type="text" id="banco" placeholder="CBU / Clave banco" class="w-full px-3 py-1.5 border border-amber-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-amber-900 uppercase mb-1">Clave ARCA</label>
                            <input type="text" id="arca" placeholder="Clave Fiscal" class="w-full px-3 py-1.5 border border-amber-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-amber-900 uppercase mb-1">Clave Rentas</label>
                            <input type="text" id="rentas" placeholder="Clave DGR" class="w-full px-3 py-1.5 border border-amber-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white font-mono">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-amber-900 uppercase mb-1">Clave ART</label>
                            <input type="text" id="art" placeholder="Clave Mutua / ART" class="w-full px-3 py-1.5 border border-amber-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white font-mono">
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" id="btnCancelar" onclick="window.limpiarFormulario()" class="hidden bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-xs font-semibold hover:bg-slate-300 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" id="btnGuardar" class="bg-amber-800 text-white px-5 py-2 rounded-lg text-xs font-semibold hover:bg-amber-900 transition-colors shadow-sm">
                            Guardar Cliente
                        </button>
                    </div>
                </form>
            </div>

            <!-- BUSCADOR -->
            <div class="mb-4">
                <input type="text" id="buscador" placeholder="🔍 Buscar por nombre, CUIT, condición o claves..." class="w-full px-4 py-2.5 border border-amber-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-white/90 shadow-2xs">
            </div>

            <!-- CONTENEDOR DE CLIENTES -->
            <div id="contenedorClientes" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                <!-- Se poblará dinámicamente -->
            </div>

        </div>
    </div>

    <!-- MODAL FILTROS DE IMPRESIÓN -->
    <div id="modalImprimir" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-amber-200">
            <h3 class="text-lg font-bold text-amber-900 mb-4">Opciones de Reporte</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-amber-900 uppercase mb-2">Filtrar por Condición IVA</label>
                    <div class="space-y-1.5 text-xs">
                        <label class="flex items-center gap-2"><input type="radio" name="filtroImpresionCondicion" value="Todos" checked class="text-amber-700"> Todos</label>
                        <label class="flex items-center gap-2"><input type="radio" name="filtroImpresionCondicion" value="RI" class="text-amber-700"> Responsable Inscripto</label>
                        <label class="flex items-center gap-2"><input type="radio" name="filtroImpresionCondicion" value="Monotributo" class="text-amber-700"> Monotributo</label>
                        <label class="flex items-center gap-2"><input type="radio" name="filtroImpresionCondicion" value="Exento" class="text-amber-700"> Exento</label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-amber-900 uppercase mb-2">Filtrar por Estado</label>
                    <div class="space-y-1.5 text-xs">
                        <label class="flex items-center gap-2"><input type="radio" name="filtroImpresionEstado" value="Todos" checked class="text-amber-700"> Todos</label>
                        <label class="flex items-center gap-2"><input type="radio" name="filtroImpresionEstado" value="Activo" class="text-amber-700"> Activo</label>
                        <label class="flex items-center gap-2"><input type="radio" name="filtroImpresionEstado" value="Inactivo" class="text-amber-700"> Inactivo</label>

                </div>

            <div class="flex justify-end gap-2 mt-6">
                <button onclick="window.toggleModalImprimir()" class="px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
                <button onclick="window.ejecutarImpresion()" class="px-4 py-1.5 text-xs font-semibold bg-amber-800 text-white rounded-lg hover:bg-amber-900 shadow-sm">Generar Vista de Impresión</button>
            </div>
        </div>
    </div>

</body>
